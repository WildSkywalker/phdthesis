name: Sync to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Upload Repository 1
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: '*/*'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'false' # optional boolean
          mirrorDirectoryStructure: 'true' # optional boolean
      
      - name: Upload Repository 2
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: '*/*/*'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'false' # optional boolean
          mirrorDirectoryStructure: 'true' # optional boolean
      
      - name: Upload Thesis to Root Directory
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: 'Thesis Main/phdthesis_YiGu.pdf'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          name: 'Yi_Gu_Thesis_PhD_Math.pdf'
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'false' # optional boolean
          mirrorDirectoryStructure: 'false' # optional boolean