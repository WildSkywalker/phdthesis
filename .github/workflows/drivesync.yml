name: Upload to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Find and Remove Old rclone (if any)
        run: |
          echo "Removing potential old rclone installations..."
          sudo apt-get remove -y rclone # Try to remove via apt
          sudo rm -f /usr/bin/rclone  # Remove from common location
          sudo rm -f /usr/local/bin/rclone # Remove from another common location
          hash -r # Reset the command hash

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Verify rclone Version
        run: |
          /usr/bin/rclone version

      - name: Configure rclone
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_FILE: credentials.json
          RCLONE_CONFIG_GDRIVE_TEAM_DRIVE: ""
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          echo "${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}" > credentials.json
          /usr/bin/rclone config create gdrive drive config_is_local false

      - name: Upload to Google Drive
        run: |
          /usr/bin/rclone copy . gdrive: --drive-server-side-across-configs -v