name: Sync to Google Drive

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Upload Main Thesis
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: 'Thesis Main/phdthesis_YiGu.pdf'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'true' # optional boolean
          mirrorDirectoryStructure: 'false' # optional boolean

      - name: Upload t-SNE Paper
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: 't-SNE/main paper/t-sne.pdf'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'true' # optional boolean
          mirrorDirectoryStructure: 'false' # optional boolean
      
      - name: Upload t-SNE Existence and Uniqueness Proof
        uses: logickoder/g-drive-upload@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
          filename: 't-SNE/Existence&Uniqueness/Existence&Uniqueness.pdf'
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: 'true' # optional boolean
          useCompleteSourceFilenameAsName: 'true' # optional boolean
          mirrorDirectoryStructure: 'false' # optional boolean